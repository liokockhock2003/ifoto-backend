name: Backend CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job name must stay "build-and-test" — it's a required status check on main
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ifotodb_test
          MYSQL_USER: ifoto_admin_test
          MYSQL_PASSWORD: ifoto_admin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_PROFILES_ACTIVE: test
      TEST_DB_URL: jdbc:mysql://localhost:3306/ifotodb_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kuala_Lumpur
      TEST_DB_USER: ifoto_admin_test
      TEST_DB_PASS: ifoto_admin_test
      JWT_SECRET: test-secret-key-32-chars-minimum-length-for-ci-only
      JWT_EXPIRATION_MS: 86400000
      TZ: Asia/Kuala_Lumpur

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # verify = compile + unit/integration tests + JaCoCo coverage gate
      - name: Build and test
        run: ./mvnw -B -ntp clean verify

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same Dockerfile Railway builds — catches a broken image before it reaches deploy
      - name: Build image
        run: docker build -t ifoto-backend:ci .

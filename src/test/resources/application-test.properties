# ── Test (CI) ─────────────────────────────────────────────────────────────────

spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USER}
spring.datasource.password=${TEST_DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-expiration-ms=604800000

spring.jpa.show-sql=false

app.cors.allowed-origins=https://ifoto.ahmadsaifudin.com/login

app.frontend.login-url=${APP_FRONTEND_LOGIN_URL:https://ifoto.ahmadsaifudin.com/login}

# Stub out Billplz so context loads without real credentials
billplz.api-key=test-api-key
billplz.collection-id=test-collection-id
billplz.x-signature-key=test-x-signature-key
billplz.base-url=https://www.billplz-sandbox.com/api/v3
billplz.callback-url=http://localhost:8080/api/v1/payments/callback
billplz.redirect-url=http://localhost:5173/payment/result

# Stub out mail so context loads without SMTP credentials
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# ── Production ────────────────────────────────────────────────────────────────

spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USER}
spring.datasource.password=${PROD_DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

spring.jpa.show-sql=false

app.cors.allowed-origins=https://ifoto.ahmadsaifudin.com/login

app.frontend.login-url=${APP_FRONTEND_LOGIN_URL:https://ifoto.ahmadsaifudin.com/login}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Mail — from address must use a verified domain in Resend
app.mail.from=${APP_MAIL_FROM}

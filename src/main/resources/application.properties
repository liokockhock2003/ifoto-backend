spring.application.name=ifoto-backend
server.port=${PORT:8080}

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5

spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${APP_MAIL_FROM:no-reply@ifoto.local}
app.mail.app-name=${APP_MAIL_APP_NAME:iFoto}

app.password-reset.token-expiration-ms=${APP_PASSWORD_RESET_TOKEN_EXPIRATION_MS:900000}
app.password-reset.reset-url-base=${APP_PASSWORD_RESET_URL_BASE:http://localhost:5173/reset-password}

app.email-verification.token-expiration-ms=${EMAIL_VERIFY_TOKEN_EXPIRY_MS:86400000}
app.email-verification.verify-url-base=${EMAIL_VERIFY_URL_BASE:http://localhost:5173/verify-email}

app.rental.buffer-minutes=60

billplz.api-key=${BILLPLZ_API_KEY}
billplz.collection-id=${BILLPLZ_COLLECTION_ID}
billplz.x-signature-key=${BILLPLZ_X_SIGNATURE_KEY}
billplz.base-url=${BILLPLZ_BASE_URL:https://www.billplz-sandbox.com/api/v3}
billplz.callback-url=${BILLPLZ_CALLBACK_URL}
billplz.redirect-url=${BILLPLZ_REDIRECT_URL}
